<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Novia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            transition: opacity 1s ease;
            cursor: pointer;
        }

        #overlay h1 {
            font-size: 2rem;
            color: #ff4d6d;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.7);
            text-align: center;
        }

        .btn-start {
            padding: 12px 28px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            border: none;
            border-radius: 25px;
            color: white;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #letter-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
        }

        #letter-btn:hover {
            background: rgba(255, 77, 109, 0.5);
        }

        #modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(20, 10, 15, 0.9);
            border: 1px solid rgba(255, 77, 109, 0.3);
            border-radius: 15px;
            padding: 25px;
            max-width: 450px;
            width: 85%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
            position: relative;
            line-height: 1.6;
            direction: rtl;
            text-align: justify;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #ff758f;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="overlay" onclick="initExperience()">
        <h1>Feliz Día de la Novia 💗</h1>
        <button class="btn-start">Toca para iniciar ❤️</button>
    </div>

    <div id="canvas-container"></div>

    <button id="letter-btn" onclick="toggleModal(true)">💌 باز کردن نامه</button>

    <div id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleModal(false)">&times;</span>
            <h2 style="color: #ff4d6d; text-align: center; margin-bottom: 15px;">روزت مبارک ❤️</h2>
            <p id="modal-text">
                بعضی از آدم‌ها وارد زندگی‌مان می‌شوند و بدون اثر می‌گذرند، اما تو به گونه‌ای متفاوت آمدی. کم‌کم به کسی تبدیل شدی که بدون او هیچ روزی کامل نیست.
                <br><br>
                از تو ممنونم برای هر خاطره‌ای که ساختیم و برای اینکه اجازه دادی بخشی از زندگی‌ات باشم. مرسی که هستی! 💕
            </p>
        </div>
    </div>

    <!-- موزیک دقیقاً همان فایل لود شده در سایت اصلی -->
    <audio id="audio-player" loop preload="auto">
        <source src="https://corazon-galactico-dia-de-la-novia.netlify.app/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ========================================================
        // ✏️ نوشته‌های معلق روی هوا را اینجا می‌توانید تغییر دهید:
        // ========================================================
        const customFloatingTexts = [
            "Feliz día de la novia ❤️",
            "دوستت دارم 💕",
            "امید زندگی من ✨",
            "زیباترین اتفاق 💖",
            "کوچولوووو 🫵🏻🎀",
            "دنیای من 💗"
        ];

        let scene, camera, renderer, controls, heartMesh, textGroup;

        function initExperience() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('letter-btn').style.display = 'block';
            }, 1000);

            const audio = document.getElementById('audio-player');
            audio.play().catch(() => console.log("Audio playback blocked"));

            initScene();
        }

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff4d6d, 1.5);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            buildStars();
            build3DHeart();
            buildOrbitTexts();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildStars() {
            const count = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 80;
                positions[i + 1] = (Math.random() - 0.5) * 80;
                positions[i + 2] = (Math.random() - 0.5) * 80;

                colors[i] = 1;
                colors[i + 1] = Math.random() * 0.4 + 0.3;
                colors[i + 2] = Math.random() * 0.6 + 0.4;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            scene.add(new THREE.Points(geometry, material));
        }

        function build3DHeart() {
            const shape = new THREE.Shape();
            const x = 0, y = 0;

            shape.moveTo(x + 0.25, y + 0.25);
            shape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
            shape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
            shape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.15, y + 0.77, x + 0.25, y + 0.95);
            shape.bezierCurveTo(x + 0.65, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
            shape.bezierCurveTo(x + 0.8, y, x + 0.5, y, x + 0.5, y);
            shape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

            const extrudeSettings = {
                depth: 0.2,
                bevelEnabled: true,
                bevelSegments: 4,
                steps: 2,
                bevelSize: 0.1,
                bevelThickness: 0.1
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshStandardMaterial({
                color: 0xff0043,
                roughness: 0.3,
                metalness: 0.8,
                emissive: 0x33000d
            });

            heartMesh = new THREE.Mesh(geometry, material);
            heartMesh.rotation.x = Math.PI;
            heartMesh.scale.set(2.5, 2.5, 2.5);
            scene.add(heartMesh);
        }

        function buildOrbitTexts() {
            textGroup = new THREE.Group();

            customFloatingTexts.forEach((textStr, i) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 128;

                ctx.font = 'Bold 34px Arial, Tahoma';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff4d6d';
                ctx.shadowBlur = 10;
                ctx.fillText(textStr, 256, 70);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);

                const angle = (i / customFloatingTexts.length) * Math.PI * 2;
                const radius = 4;

                sprite.position.x = Math.cos(angle) * radius;
                sprite.position.y = (Math.random() - 0.5) * 2;
                sprite.position.z = Math.sin(angle) * radius;
                sprite.scale.set(3, 0.75, 1);

                textGroup.add(sprite);
            });

            scene.add(textGroup);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (heartMesh) {
                heartMesh.rotation.y += 0.008;
                heartMesh.position.y = Math.sin(Date.now() * 0.002) * 0.15;
            }

            if (textGroup) {
                textGroup.rotation.y -= 0.005;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleModal(show) {
            const modal = document.getElementById('modal');
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }
    </script>
</body>
</html>
