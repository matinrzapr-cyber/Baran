<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تو کهکشان منی ✨</title>
    
    <!-- فونت وزdirect و آیکون‌های اصلی سایت -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* پس‌زمینه ستاره‌ای و کهکشانی اصلی */
        #galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #030308 100%);
            z-index: 1;
        }

        /* کارت شیشه‌ای اصلی FluyeCreative */
        .card-container {
            position: relative;
            z-index: 10;
            width: 88%;
            max-width: 390px;
            padding: 2.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(168, 85, 247, 0.15);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .heart-icon-top {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.6rem;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .sub-title {
            font-size: 0.85rem;
            font-weight: 300;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2.2rem;
        }

        /* دکمه با انیمیشن Glow و Pulse اصلی */
        .btn-action {
            position: relative;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: pulse 2s infinite;
            transition: all 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        /* بخش پیام بازشونده */
        .reveal-box {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .reveal-box.open {
            max-height: 250px;
            opacity: 1;
            margin-top: 1.5rem;
            padding: 1.2rem;
        }

        .reveal-text {
            color: #f4f4f5;
            font-size: 0.95rem;
            line-height: 1.8;
            font-weight: 300;
        }

        /* انیمیشن‌ها */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
    </style>
</head>
<body>

    <div id="galaxy-bg"></div>

    <div class="card-container">
        <div class="heart-icon-top">
            <i class="fa-solid fa-sparkles"></i> ✨
        </div>

        <h1 class="main-title">تو کهکشان منی</h1>
        <p class="sub-title">ارزش و معنی تو در زندگی من، عشقم</p>

        <button class="btn-action" onclick="toggleMessage()">
            <span>✨ پرنسس زیبا، لمس کن تا ببینی ✨</span>
            <i class="fa-solid fa-play" style="font-size: 0.8rem;"></i>
        </button>

        <div class="reveal-box" id="messageBox">
            <p class="reveal-text">
                امروز و هر روز، می‌خوام بدونی که وجودت چقدر دنیام رو قشنگ‌تر کرده. 
                تو معجزه‌ی زندگی منی و تمام روشنیِ شب‌های تاریک من! 💖
            </p>
        </div>
    </div>

    <!-- کتابخانه افکت کهکشان اصلی سایت -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('galaxy-bg', {
            "particles": {
                "number": { "value": 130, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#ffffff", "#ec4899", "#a855f7"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.8, "random": true },
                "size": { "value": 2.5, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.6, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": {
                "events": { "onclick": { "enable": true, "mode": "push" } },
                "modes": { "push": { "particles_nb": 4 } }
            }
        });

        function toggleMessage() {
            const box = document.getElementById('messageBox');
            box.classList.toggle('open');
        }
    </script>
</body>
</html>
