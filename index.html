<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کهکشان عشق من ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000005;
      color: #fff;
    }

    /* بوم سه بعدی Three.js */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* رابط کاربری روی کهکشان */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
    }

    .header-title {
      text-align: center;
      background: rgba(10, 10, 25, 0.6);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
      pointer-events: auto;
    }

    .header-title h1 {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f43f5e, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title p {
      font-size: 0.8rem;
      color: #d1d5db;
      margin-top: 4px;
    }

    .controls-hint {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #f3e8ff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: pulse 2s infinite;
      pointer-events: auto;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>

  <!-- کتابخانه اصلی گرافیک ۳ بعدی Three.js و OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="header-title">
      <h1>تو کهکشان منی ✨</h1>
      <p>آنچه تو برای من ارزش داری، عشقم</p>
    </div>

    <div class="controls-hint">
      ✨ صفحه را لمس کن و بچرخان تا در کهکشان بگردی ✨
    </div>
  </div>

  <script>
    // 1. آماده‌سازی صحنه ۳ بعدی
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // مه پس‌زمینه برای عمق کهکشان
    scene.fog = new THREE.FogExp2(0x03030c, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // کنترل‌های چرخش با لمس / ماوس (OrbitControls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8; // چرخش خودکار کهکشان

    // 2. ساخت ذرات مارپیچی کهکشان (Spiral Galaxy)
    const galaxyParams = {
      count: 12000,
      size: 0.7,
      radius: 60,
      branches: 4,
      spin: 1,
      randomness: 0.5,
      insideColor: '#f43f5e',
      outsideColor: '#3b82f6'
    };

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(galaxyParams.count * 3);
    const colors = new Float32Array(galaxyParams.count * 3);

    const colorInside = new THREE.Color(galaxyParams.insideColor);
    const colorOutside = new THREE.Color(galaxyParams.outsideColor);

    for (let i = 0; i < galaxyParams.count; i++) {
      // موقعیت
      const i3 = i * 3;
      const radius = Math.random() * galaxyParams.radius;
      const spinAngle = radius * galaxyParams.spin;
      const branchAngle = ((i % galaxyParams.branches) / galaxyParams.branches) * Math.PI * 2;

      const randomX = (Math.random() - 0.5) * galaxyParams.randomness * radius;
      const randomY = (Math.random() - 0.5) * galaxyParams.randomness * radius;
      const randomZ = (Math.random() - 0.5) * galaxyParams.randomness * radius;

      positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
      positions[i3 + 1] = randomY;
      positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

      // رنگ‌آمیزی طیفی
      const mixedColor = colorInside.clone();
      mixedColor.lerp(colorOutside, radius / galaxyParams.radius);

      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: galaxyParams.size,
      sizeAttenuation: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true
    });

    const galaxyPoints = new THREE.Points(geometry, material);
    scene.add(galaxyPoints);

    // 3. افزودن کلمات و متون عاشقانه معلق در فضای سه بعدی
    const loveMessages = [
      "پرنسس من 👑",
      "تو جهان منی 🌌",
      "دلیل خنده‌هام 😊",
      "روشنی روزگارم ✨",
      "همه وجودم 💖",
      "ماه من 🌙",
      "تا ابد با هم ♾️",
      "عشق همیشگی من 🌸",
      "رویای زیباترم 💫",
      "نفسم 🫀"
    ];

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.font = 'Bold 36px Vazirmatn, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 15;
      ctx.fillText(text, 256, 70);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ 
        map: texture, 
        transparent: true,
        blending: THREE.AdditiveBlending
      });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(18, 4.5, 1);
      return sprite;
    }

    // پخش کردن متن‌های عاشقانه در سراسر کهکشان ۳ بعدی
    loveMessages.forEach((msg) => {
      const sprite = createTextSprite(msg);
      const angle = Math.random() * Math.PI * 2;
      const dist = 15 + Math.random() * 35;
      const height = (Math.random() - 0.5) * 20;

      sprite.position.set(
        Math.cos(angle) * dist,
        height,
        Math.sin(angle) * dist
      );
      scene.add(sprite);
    });

    // 4. حلقه انیمیشن و رندر
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // چرخش آرام ذرات
      galaxyPoints.rotation.y = elapsedTime * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // تنظیم مجدد اندازه با تغییر سایز صفحه
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
